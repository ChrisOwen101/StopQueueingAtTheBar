<!doctype html><meta charset="utf-8"><title>Round 1</title>
<style>
body{margin:0;background:#fff;font-family:'Avenir Next',sans-serif;padding:24px 28px;color:#000}
h1{font-size:20px;margin:0 0 10px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 20px}
.cell{border:1px solid #ddd;padding:10px 12px}
.cell h2{font-size:14px;margin:0 0 6px;font-weight:800}
.row{display:flex;gap:12px;align-items:flex-end}
.rev{background:#000;padding:8px}.rev img{filter:invert(1)}
.tiny{display:flex;flex-direction:column;gap:8px;align-items:center}
.tiny img{image-rendering:auto}
small{font-size:10px;color:#555}
</style>
<h1>Don't Queue At The Bar · Round 1 · eight directions, one colour · mat size, reversed, 64px, 32px</h1>
<div class="grid" id="g"></div>
<script>
const d=[["01","The Cluster roundel","01-roundel.svg"],["02","No single file","02-no-single-file.svg"],["03","Wrong / right","03-wrong-right.svg"],["04","Pint of heads","04-pint-of-heads.svg"],["05","Type stamp","05-type-stamp.svg"],["06","Spread along the bar","06-bar-arrows.svg"],["07","Mat badge, evolved","07-mat-evolution.svg"],["08","Pick a gap","08-the-gap.svg"]];
g.innerHTML=d.map(([n,t,f])=>`<div class="cell"><h2>${n} ${t}</h2><div class="row"><img src="${f}" width="230" height="230"><div class="rev"><img src="${f}" width="118" height="118"></div><div class="tiny"><img src="${f}" width="64" height="64"><img src="${f}" width="32" height="32"><small>64 · 32</small></div></div></div>`).join('')
</script>
