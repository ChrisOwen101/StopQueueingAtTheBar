<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="The existing mat badge, in black and white, with the cluster in the middle">
  <defs>
    <path id="top" d="M 60,200 A 140,140 0 0 1 340,200"/>
    <path id="bottom" d="M 35,200 A 165,165 0 0 0 365,200"/>
  </defs>
  <circle cx="200" cy="200" r="198" fill="#000"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="200" cy="200" r="124" fill="#fff"/>
  <g font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-weight="900" fill="#fff">
    <text font-size="31" text-anchor="middle" letter-spacing="1"><textPath href="#top" startOffset="50%" textLength="395" lengthAdjust="spacingAndGlyphs">DON'T QUEUE AT THE BAR</textPath></text>
    <text font-size="26" text-anchor="middle" letter-spacing="1"><textPath href="#bottom" startOffset="50%" textLength="385" lengthAdjust="spacingAndGlyphs">SPREAD ALONG THE BAR</textPath></text>
  </g>
  <circle cx="46" cy="200" r="6" fill="#fff"/><circle cx="354" cy="200" r="6" fill="#fff"/>
  <!-- top-down: the bar and five people spread along it -->
  <g fill="#000">
    <rect x="104" y="160" width="192" height="16" rx="8"/>
    <g id="d"><ellipse cx="120" cy="212" rx="14" ry="7"/><circle cx="120" cy="206" r="8"/></g>
    <use href="#d" x="40"/><use href="#d" x="80"/><use href="#d" x="120"/><use href="#d" x="160"/>
  </g>
</svg>
