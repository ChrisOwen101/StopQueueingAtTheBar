<!doctype html><meta charset="utf-8"><title>Round 2</title>
<style>
body{margin:0;background:#fff;font-family:'Avenir Next',sans-serif;padding:24px 28px;color:#000}
h1{font-size:20px;margin:0 0 10px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 20px}
.cell{border:1px solid #ddd;padding:10px 12px}
.cell h2{font-size:14px;margin:0 0 6px;font-weight:800}
.row{display:flex;gap:12px;align-items:flex-end}
.rev{background:#000;padding:8px}.rev img{filter:invert(1)}
.tiny{display:flex;flex-direction:column;gap:8px;align-items:center}
small{font-size:10px;color:#555}
.tab{display:flex;gap:6px;align-items:center;background:#f1f1f1;border-radius:6px;padding:4px 8px;font-size:12px;width:150px}
.tab img{width:16px;height:16px}
</style>
<h1>Don't Queue At The Bar · Round 2 · the three survivors refined · mat size, reversed, 64px, 32px, browser tab (16px)</h1>
<div class="grid" id="g"></div>
<script>
const d=[["01a","Roundel, four, no words","01a-roundel-four.svg"],["01b","Roundel, three, bigger","01b-roundel-three.svg"],["01c","Roundel in a word ring (mat)","01c-roundel-wordring.svg"],["04b","Pint, no ring","04b-pint-no-ring.svg"],["04c","Pint, people in the foam","04c-pint-black-heads.svg"],["05a","Type stamp, tighter","05a-stamp-tight.svg"],["05b","Stamp with the bar","05b-stamp-roundel.svg"]];
g.innerHTML=d.map(([n,t,f])=>`<div class="cell"><h2>${n} ${t}</h2><div class="row"><img src="${f}" width="230" height="230"><div class="rev"><img src="${f}" width="118" height="118"></div><div class="tiny"><img src="${f}" width="64" height="64"><img src="${f}" width="32" height="32"><div class="tab"><img src="${f}">Don't Queue At…</div><small>64 · 32 · tab</small></div></div></div>`).join('')
</script>
