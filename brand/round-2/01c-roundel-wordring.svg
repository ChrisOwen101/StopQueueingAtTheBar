    <path id="top" d="M 58,200 A 142,142 0 0 1 342,200"/>
    <path id="bot" d="M 58,200 A 142,142 0 0 0 342,200"/>
  </defs>
  <circle cx="200" cy="200" r="194" fill="none" stroke="#000" stroke-width="8"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#000" stroke-width="20"/>
  <g fill="#000"><use href="#p" x="132" y="166"/><use href="#p" x="200" y="166"/><use href="#p" x="268" y="166"/></g>
  <rect x="84" y="214" width="232" height="44" fill="#000"/>
  <g font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="28" fill="#000" text-anchor="middle" letter-spacing="2">
    <text><textPath href="#top" startOffset="50%">DON'T QUEUE AT THE BAR</textPath></text>
