<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="107mm" height="107mm" role="img" aria-labelledby="t">
  <title id="t">Don't Queue At The Bar</title>
  <defs>
    <path id="top" d="M 60,200 A 140,140 0 0 1 340,200"/>
    <path id="bottom" d="M 35,200 A 165,165 0 0 0 365,200"/>

    <!-- one person in profile, facing right, feet on y=250 -->
    <g id="p">
      <circle cx="0" cy="176" r="9"/>
      <path d="M 7,173 L 14,178 L 7,182 Z"/>
      <rect x="-9" y="188" width="18" height="36" rx="7"/>
      <rect x="-7" y="218" width="6" height="32" rx="2"/>
      <rect x="1" y="218" width="6" height="32" rx="2"/>
    </g>
  </defs>

  <!-- badge: ink and cream only -->
  <circle cx="200" cy="200" r="198" fill="#16161d"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#fff4dc" stroke-width="2"/>
  <circle cx="200" cy="200" r="124" fill="#fff4dc"/>
  <circle cx="200" cy="200" r="116" fill="none" stroke="#16161d" stroke-width="2"/>

  <!-- words around the outside -->
  <g font-family="'Avenir Next','Helvetica Neue','Segoe UI',Arial,sans-serif" font-weight="900" fill="#fff4dc">
    <text font-size="31" text-anchor="middle" letter-spacing="1">
      <textPath href="#top" startOffset="50%" textLength="395" lengthAdjust="spacingAndGlyphs">DON'T QUEUE AT THE BAR</textPath>
    </text>
    <text font-size="26" text-anchor="middle" letter-spacing="1">
      <textPath href="#bottom" startOffset="50%" textLength="385" lengthAdjust="spacingAndGlyphs">SPREAD ALONG THE BAR</textPath>
    </text>
  </g>

  <!-- separators -->
  <circle cx="46" cy="200" r="6" fill="#fff4dc"/>
  <circle cx="354" cy="200" r="6" fill="#fff4dc"/>

  <!-- side-on scene: a single-file queue shuffling towards the bar -->
  <g fill="#16161d">
    <!-- floor -->
    <rect x="98" y="250" width="204" height="4" rx="2"/>

    <!-- queue -->
    <use href="#p" x="116"/>
    <use href="#p" x="146"/>
    <use href="#p" x="176"/>
    <use href="#p" x="206"/>

    <!-- the bar: counter, top slab, pint and tap -->
    <rect x="240" y="216" width="58" height="34"/>
    <rect x="235" y="208" width="68" height="9" rx="3"/>
    <path d="M 262,184 H 278 L 276,208 H 264 Z"/>
    <rect x="285" y="188" width="6" height="20"/>
    <rect x="279" y="186" width="18" height="6" rx="3"/>
  </g>

  <!-- foam on the pint -->
  <path d="M 261,184 Q 262,177 270,179 Q 278,177 279,184 Z" fill="#fff4dc" stroke="#16161d" stroke-width="2"/>

  <!-- waiting... -->
  <g fill="#16161d">
    <circle cx="146" cy="150" r="3.5"/>
    <circle cx="160" cy="150" r="3.5"/>
    <circle cx="174" cy="150" r="3.5"/>
  </g>
</svg>
