<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="107mm" height="107mm" role="img" aria-label="Beer mat: this is a bar, not a post office. You may stop queueing now.">
  <title>Beer mat: this is a bar, not a post office. You may stop queueing now.</title>
  <circle cx="200" cy="200" r="200" fill="#2447f5"/>
  <circle cx="200" cy="200" r="186" fill="#fff4dc"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="#16161d" stroke-width="3"/>
  <g font-family="'Avenir Next','Helvetica Neue','Segoe UI',Arial,sans-serif" fill="#16161d" text-anchor="middle">
    <text x="200" y="104" font-size="17" font-weight="700" letter-spacing="2" opacity="0.75">THIS IS A BAR</text>
    <text x="200" y="183.9" font-size="42" font-weight="900" letter-spacing="-0.8">NOT A POST</text>
    <text x="200" y="246.3" font-size="70" font-weight="900" letter-spacing="-1.4">OFFICE</text>
    <text x="200" y="300" font-size="17" font-weight="700" letter-spacing="2" opacity="0.75">YOU MAY STOP</text>
    <text x="200" y="324" font-size="17" font-weight="700" letter-spacing="2" opacity="0.75">QUEUEING NOW.</text>
  </g>
</svg>
